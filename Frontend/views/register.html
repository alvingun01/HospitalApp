<div class="auth-container" style="max-width: 580px;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 10.5V20C19 20.5523 18.5523 21 18 21H6C5.44772 21 5 20.5523 5 20V10.5" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 9V15M9 12H15" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 3H10C8.89543 3 8 3.89543 8 5V9H16V5C16 3.89543 15.1046 3 14 3Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <span>HOSPITAL PORTAL</span>
            </div>
            <h2 class="auth-title">Create Patient Account</h2>
            <p class="auth-subtitle">Register to request appointments and view billing</p>
        </div>

        <!-- Error Alert -->
        <div class="alert-error" ng-show="errorMessage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ errorMessage }}</span>
        </div>

        <form name="registerForm" ng-submit="register()">
            <!-- Account Info -->
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" placeholder="John Doe" ng-model="name" required />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="john@example.com" ng-model="email" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Create password" ng-model="password" required />
                </div>
            </div>

            <!-- Profile Info -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-input" placeholder="+1 (555) 019-9234" ng-model="phone" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Street Address</label>
                    <input type="text" class="form-input" placeholder="123 Health St." ng-model="address" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" class="form-input" placeholder="Austin" ng-model="city" required />
                </div>
                <div class="form-group">
                    <label class="form-label">State / Province</label>
                    <input type="text" class="form-input" placeholder="TX" ng-model="state" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Zip / Postal Code</label>
                    <input type="text" class="form-input" placeholder="78701" ng-model="zip_code" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-input" placeholder="United States" ng-model="country" required />
                </div>
            </div>

            <button type="submit" class="btn-primary" ng-disabled="registerForm.$invalid">Create Account</button>
        </form>

        <div class="auth-footer">
            <span>Already have an account? </span>
            <a href="#!/login" class="auth-link">Sign In</a>
        </div>
    </div>
</div>
