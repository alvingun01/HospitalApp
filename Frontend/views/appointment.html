<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="16" y1="2" x2="16" y2="6" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="2" x2="8" y2="6" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                    <line x1="3" y1="10" x2="21" y2="10" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>BOOK APPOINTMENT</span>
            </div>
            <h2 class="auth-title">Schedule a Visit</h2>
            <p class="auth-subtitle">Select a specialist and choose your preferred date and time</p>
        </div>

        <!-- Success Alert -->
        <div class="alert-success" ng-show="successMessage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>{{ successMessage }}</span>
        </div>

        <!-- Error Alert -->
        <div class="alert-error" ng-show="errorMessage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ errorMessage }}</span>
        </div>

        <form ng-submit="submitAppointment()">
            <div class="form-group">
                <label class="form-label" for="doctorId">Doctor / Specialist</label>
                <select id="doctorId" class="form-input" ng-model="appointment.doctorId" required>
                    <option value="" disabled selected>Select a Doctor</option>
                    <option ng-repeat="doctor in doctors" value="{{doctor.id}}">
                        Dr. {{doctor.user.first_name}} {{doctor.user.last_name}} ({{doctor.specialization}})
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="appointmentDate">Appointment Date</label>
                    <input type="date" id="appointmentDate" class="form-input" ng-model="appointment.appointmentDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="appointmentTime">Preferred Time</label>
                    <input type="time" id="appointmentTime" class="form-input" ng-model="appointment.appointmentTime" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Confirm Appointment</button>
        </form>

        <div class="auth-footer">
            <a href="#!/" class="auth-link">Back to Dashboard</a>
        </div>
    </div>
</div>
