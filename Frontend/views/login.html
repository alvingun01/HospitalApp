<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 10.5V20C19 20.5523 18.5523 21 18 21H6C5.44772 21 5 20.5523 5 20V10.5" stroke="#0284c7"
                        stroke-width="2" stroke-linecap="round" />
                    <path d="M12 9V15M9 12H15" stroke="#0284c7" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M14 3H10C8.89543 3 8 3.89543 8 5V9H16V5C16 3.89543 15.1046 3 14 3Z" fill="#e0f2fe"
                        stroke="#0284c7" stroke-width="2" stroke-linejoin="round" />
                </svg>
                <span>HOSPITAL PORTAL</span>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your medical dashboard</p>
        </div>

        <!-- Error Alert -->
        <div class="alert-error" ng-show="errorMessage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ errorMessage }}</span>
        </div>

        <form ng-submit="login()">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="name@hospital.com" ng-model="email" required />
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-wrapper">
                    <input ng-attr-type="{{ showPassword ? 'text' : 'password' }}" class="form-input"
                        placeholder="Enter password" ng-model="password" required />
                    <button type="button" class="password-toggle" ng-click="togglePassword()" aria-label="Toggle password visibility">
                        <!-- Eye Icon (when hidden) -->
                        <svg ng-if="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Eye Off Icon (when visible) -->
                        <svg ng-if="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            <span>Don't have an account? </span>
            <a href="#!/register" class="auth-link">Register here</a>
        </div>
    </div>
</div>
