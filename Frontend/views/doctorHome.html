<div class="home-container">
    <div class="header-nav">
        <h1>Doctor Dashboard</h1>
        <div class="nav-actions">
            <button ng-click="logout()" class="btn-danger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>
    </div>

    <!-- Dashboard Column Layout -->
    <div class="dashboard-columns">
        <!-- Upcoming Appointments Column -->
        <div class="dashboard-col">
            <h2 class="col-heading">Your Upcoming Appointments</h2>
            <div class="appointments-list">
                <doctor-app-card ng-repeat="app in upcomingAppointments" appointment="app"></doctor-app-card>
                <div class="no-app-placeholder" ng-if="upcomingAppointments.length === 0">
                    No upcoming patient appointments scheduled.
                </div>
            </div>
        </div>

        <!-- Completed Appointments Column -->
        <div class="dashboard-col">
            <h2 class="col-heading">Your Completed Appointments</h2>
            <div class="appointments-list">
                <doctor-app-card ng-repeat="app in completedAppointments" appointment="app"></doctor-app-card>
                <div class="no-app-placeholder" ng-if="completedAppointments.length === 0">
                    No completed patient appointments.
                </div>
            </div>
        </div>
    </div>
</div>
